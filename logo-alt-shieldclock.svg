    <!-- clock hands -->
    <line x1="256" y1="262" x2="256" y2="196" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <line x1="256" y1="262" x2="312" y2="286" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <circle cx="256" cy="262" r="14" fill="#ffffff"/>
