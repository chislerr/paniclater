<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#141d5e" flood-opacity="0.32"/>
    </filter>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#gloss)"/>

  <g filter="url(#soft)">
    <!-- bell body: smooth bezier silhouette with flared skirt -->
    <path fill="#ffffff" d="M 256 112
      C 176 112 148 196 146 268
      C 145 312 138 336 122 350
      L 390 350
      C 374 336 367 312 366 268
      C 364 196 336 112 256 112 Z"/>
    <!-- lip -->
    <rect x="104" y="342" width="304" height="28" rx="14" fill="#ffffff"/>
    <!-- knob -->
    <circle cx="256" cy="94" r="16" fill="#ffffff"/>
    <!-- clapper -->
    <circle cx="256" cy="396" r="21" fill="#ffffff"/>
  </g>

  <!-- Zz -->
  <g fill="#ffffff" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-weight="800">
    <text x="346" y="150" font-size="86" transform="rotate(10 346 150)">Z</text>
    <text x="414" y="216" font-size="54" transform="rotate(10 414 216)">Z</text>
  </g>
</svg>
